data:
  raw_path: data/raw/breast_cancer.csv
  train_path: data/processed/train.csv
  validation_path: data/processed/validation.csv
  test_path: data/processed/test.csv
  target_column: target

split:
  test_size: 0.20
  validation_size: 0.20
  random_state: 42

preprocessing:
  imputer_strategy: median

model:
  name: logistic_regression
  C: 1.0
  max_iter: 1000
  solver: lbfgs
  random_state: 42
  class_weight: null

outputs:
  metrics_path: metrics/model_metrics.json
  model_path: models/breast_cancer_pipeline.joblib



